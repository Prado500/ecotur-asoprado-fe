name: ecotur_app
description: "Cliente móvil oficial de Ecotur Asoprado - Prototipo MVP"
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1
  image_picker: ^1.0.7
  cross_file: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600